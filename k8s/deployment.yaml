apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuchat
  namespace: docuchat
  labels:
    app: docuchat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docuchat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: docuchat
    spec:
      containers:
        - name: docuchat
          image: ghcr.io/daranikettimuthu20/docuchat-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docuchat-secrets
                  key: ANTHROPIC_API_KEY
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15